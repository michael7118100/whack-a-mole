<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>經典網頁打地鼠 - Whack-A-Mole</title>
  <style>
    :root {
      --bg-top: #38bdf8;
      --bg-bottom: #86efac;
      --grass-main: #22c55e;
      --grass-dark: #15803d;
      --hole-rim: #78350f;
      --hole-inside: #291305;
      --card-bg: rgba(255, 255, 255, 0.92);
      --primary: #f59e0b;
      --primary-hover: #d97706;
      --danger: #ef4444;
      --text-dark: #1e293b;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      background: linear-gradient(180deg, var(--bg-top) 0%, #bae6fd 35%, var(--bg-bottom) 35%, #16a34a 100%);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 560px;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2), inset 0 2px 0 rgba(255, 255, 255, 0.8);
      border: 4px solid #ffffff;
      position: relative;
    }

    /* 畫面震動與紅光特效 */
    @keyframes shake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-10px, 6px); }
      40% { transform: translate(10px, -6px); }
      60% { transform: translate(-8px, -4px); }
      80% { transform: translate(8px, 4px); }
    }
    .shake-danger {
      animation: shake 0.35s ease-in-out;
      box-shadow: 0 0 35px rgba(239, 68, 68, 0.85) !important;
      border-color: var(--danger) !important;
    }

    /* 頂部標題與統計資訊 */
    .header {
      text-align: center;
      margin-bottom: 14px;
    }

    .title {
      margin: 0 0 12px 0;
      font-size: 1.85rem;
      font-weight: 900;
      color: #9a3412;
      text-shadow: 2px 2px 0px #fef08a, 0 4px 10px rgba(0, 0, 0, 0.12);
      letter-spacing: 1px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat-box {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      padding: 8px 10px;
      text-align: center;
      box-shadow: 0 3px 0 #cbd5e1;
    }

    .stat-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: #64748b;
      display: block;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 900;
      color: #0f172a;
    }

    .stat-value.score { color: #d97706; }
    .stat-value.best { color: #2563eb; }
    .stat-value.time { color: #16a34a; }
    .stat-value.time.low { color: #dc2626; animation: pulse 0.6s infinite alternate; }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.12); }
    }

    /* 時間進度條 */
    .progress-bar-wrap {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 16px;
      border: 1px solid #cbd5e1;
    }

    .progress-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
      transition: width 0.25s linear;
    }

    /* 控制面板 */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      background: #f1f5f9;
      padding: 10px 12px;
      border-radius: 14px;
    }

    .difficulty-group {
      display: flex;
      gap: 6px;
    }

    .diff-btn {
      border: 2px solid #cbd5e1;
      background: #ffffff;
      color: #475569;
      padding: 6px 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .diff-btn.active {
      background: #3b82f6;
      border-color: #1d4ed8;
      color: #ffffff;
      box-shadow: 0 2px 0 #1d4ed8;
    }

    .diff-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .action-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-mute {
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 1rem;
      cursor: pointer;
    }

    .btn-start {
      background: linear-gradient(180deg, #fbbf24 0%, #d97706 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 8px 18px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 #92400e;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .btn-start:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #92400e;
    }

    /* 遊戲九宮格舞台 */
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
      padding: 22px 18px 26px;
      border-radius: 20px;
      border: 4px solid #15803d;
      box-shadow: inset 0 6px 15px rgba(0, 0, 0, 0.2);
      cursor: crosshair;
      position: relative;
    }

    .hole {
      position: relative;
      height: 115px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      overflow: hidden;
      border-radius: 0 0 50% 50% / 0 0 28% 28%;
    }

    /* 地洞後層深坑 */
    .hole::before {
      content: "";
      position: absolute;
      bottom: 6px;
      width: 92%;
      height: 36px;
      background: radial-gradient(ellipse at center, #1c0d04 45%, #451a03 100%);
      border-radius: 50%;
      border: 4px solid #78350f;
      box-shadow: inset 0 8px 10px rgba(0,0,0,0.85);
      z-index: 1;
    }

    /* 地洞前層泥土草皮遮罩 */
    .hole-front {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 22px;
      background: linear-gradient(180deg, #92400e 0%, #5c2808 100%);
      border-radius: 50% 50% 14px 14px;
      border-top: 4px solid #b45309;
      z-index: 3;
      pointer-events: none;
    }

    /* 角色容器 */
    .character {
      position: relative;
      z-index: 2;
      width: 78px;
      height: 88px;
      transform: translateY(105%);
      transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .character.up {
      transform: translateY(8%);
    }

    .character.bonked {
      transform: translateY(35%) scale(0.92, 0.82);
      transition: transform 0.12s ease-in;
    }

    /* 角色圖形設計 */
    .mole-body {
      width: 68px;
      height: 78px;
      border-radius: 36px 36px 14px 14px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 16px;
      box-shadow: inset -5px -4px 0 rgba(0, 0, 0, 0.18);
    }

    .mole-normal .mole-body {
      background: linear-gradient(180deg, #b45309 0%, #78350f 100%);
      border: 3px solid #451a03;
    }

    .mole-golden .mole-body {
      background: linear-gradient(180deg, #fef08a 0%, #f59e0b 55%, #b45309 100%);
      border: 3px solid #92400e;
      box-shadow: 0 0 14px rgba(250, 204, 21, 0.9), inset -4px -4px 0 rgba(0,0,0,0.15);
    }

    .mole-bomb .mole-body {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #475569, #0f172a 75%);
      border: 3px solid #020617;
      margin-top: 10px;
    }

    /* 皇冠與引線 */
    .crown {
      position: absolute;
      top: -15px;
      font-size: 1.2rem;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.35));
    }

    .fuse {
      position: absolute;
      top: -16px;
      font-size: 1.1rem;
      animation: spark 0.3s infinite alternate;
    }

    @keyframes spark {
      from { transform: scale(0.95) rotate(-6deg); }
      to { transform: scale(1.15) rotate(8deg); }
    }

    /* 臉部表情 */
    .eyes {
      display: flex;
      gap: 14px;
      margin-bottom: 4px;
    }

    .eye {
      width: 9px;
      height: 9px;
      background: #1e1b18;
      border-radius: 50%;
      position: relative;
    }

    .eye::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 3px;
      height: 3px;
      background: #ffffff;
      border-radius: 50%;
    }

    .nose {
      width: 16px;
      height: 11px;
      background: #f43f5e;
      border-radius: 50%;
      border: 2px solid #881337;
    }

    .cheeks {
      width: 34px;
      height: 12px;
      background: #fde68a;
      border-radius: 10px;
      margin-top: -3px;
      opacity: 0.85;
    }

    .dizzy-face {
      display: none;
      font-size: 1.45rem;
      line-height: 1;
      margin-top: 2px;
    }

    .character.bonked .eyes,
    .character.bonked .nose,
    .character.bonked .cheeks {
      display: none;
    }

    .character.bonked .dizzy-face {
      display: block;
    }

    /* 飄字動畫 */
    .float-text {
      position: absolute;
      left: 50%;
      bottom: 58px;
      transform: translateX(-50%);
      font-weight: 900;
      font-size: 1.25rem;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 2px 4px rgba(0,0,0,0.45);
      animation: floatUp 0.65s ease-out forwards;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
      50% { opacity: 1; transform: translate(-50%, -26px) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -46px) scale(1); }
    }

    /* 槌子敲擊視覺回饋 */
    .hammer-fx {
      position: absolute;
      font-size: 2rem;
      pointer-events: none;
      z-index: 15;
      transform-origin: bottom right;
      animation: hammerHit 0.25s ease-out forwards;
    }

    @keyframes hammerHit {
      0% { transform: translate(-50%, -65%) rotate(35deg) scale(1.1); opacity: 1; }
      50% { transform: translate(-50%, -50%) rotate(-45deg) scale(1.25); opacity: 1; }
      100% { transform: translate(-50%, -50%) rotate(-45deg) scale(0.9); opacity: 0; }
    }

    /* 圖例說明列 */
    .legend {
      display: flex;
      justify-content: space-around;
      margin-top: 14px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #334155;
      background: #f8fafc;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }

    /* 結算彈窗 Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 26px 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.35);
      border: 4px solid #fbbf24;
      animation: popIn 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      from { transform: scale(0.75); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-title {
      font-size: 1.6rem;
      font-weight: 900;
      margin: 0 0 8px;
      color: #9a3412;
    }

    .new-record-badge {
      display: inline-block;
      background: #fef08a;
      color: #b45309;
      border: 2px solid #f59e0b;
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.85rem;
      margin-bottom: 12px;
    }

    .modal-score {
      font-size: 2.8rem;
      font-weight: 900;
      color: #d97706;
      margin: 6px 0 18px;
    }

    @media (max-width: 480px) {
      .hole { height: 96px; }
      .character { width: 66px; height: 76px; }
      .mole-body { width: 58px; height: 68px; }
      .controls { flex-direction: column; align-items: stretch; }
      .difficulty-group, .action-group { justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="container" id="gameContainer">
    <div class="header">
      <h1 class="title">🔨 經典打地鼠</h1>
      <div class="stats-grid">
        <div class="stat-box">
          <span class="stat-label">目前得分 (SCORE)</span>
          <span class="stat-value score" id="scoreDisplay">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">歷史最高 (BEST)</span>
          <span class="stat-value best" id="bestDisplay">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">剩餘時間 (TIME)</span>
          <span class="stat-value time" id="timeDisplay">30s</span>
        </div>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="timeProgress"></div>
      </div>
    </div>

    <div class="controls">
      <div class="difficulty-group" id="difficultyGroup">
        <button class="diff-btn" data-diff="easy">🌱 簡單</button>
        <button class="diff-btn active" data-diff="normal">⚡ 普通</button>
        <button class="diff-btn" data-diff="hard">🔥 困難</button>
      </div>
      <div class="action-group">
        <button class="btn-mute" id="muteBtn" title="音效開關">🔊</button>
        <button class="btn-start" id="startBtn">開始遊戲</button>
      </div>
    </div>

    <div class="board" id="board">
      <!-- 由 JS 動態生成 9 個地洞 -->
    </div>

    <div class="legend">
      <span>🐹 普通地鼠 <b>+10</b></span>
      <span>👑 黃金地鼠 <b>+30</b></span>
      <span>💣 危險炸彈 <b>-20</b></span>
    </div>
  </div>

  <!-- 結算視窗 -->
  <div class="modal-backdrop" id="resultModal">
    <div class="modal-card">
      <h2 class="modal-title">⏰ 時間到！</h2>
      <div id="newRecordBadge" class="new-record-badge" style="display: none;">🎉 恭喜打破最高紀錄！</div>
      <div style="color: #64748b; font-weight: 700;">本局最終得分</div>
      <div class="modal-score" id="finalScore">0</div>
      <p id="finalComment" style="color: #475569; margin: 0 0 20px; font-weight: 600;"></p>
      <button class="btn-start" id="playAgainBtn" style="width: 100%; padding: 12px;">🔄 再玩一次</button>
    </div>
  </div>

  <script>
    // --- 遊戲參數設定 ---
    const GAME_DURATION = 30;
    const STORAGE_KEY = 'whack_a_mole_high_score_v1';

    const DIFFICULTY_CONFIG = {
      easy:   { spawnInterval: 900, stayTime: 1000, doubleChance: 0 },
      normal: { spawnInterval: 650, stayTime: 750,  doubleChance: 0.1 },
      hard:   { spawnInterval: 450, stayTime: 550,  doubleChance: 0.35 }
    };

    // --- 狀態變數 ---
    let score = 0;
    let highScore = Number(localStorage.getItem(STORAGE_KEY)) || 0;
    let timeLeft = GAME_DURATION;
    let currentDiff = 'normal';
    let isPlaying = false;
    let isMuted = false;

    let countdownTimer = null;
    let spawnTimer = null;
    let holeTimeouts = new Array(9).fill(null);
    let activeHoles = new Array(9).fill(null);

    // --- Web Audio API 音效合成器 ---
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSound(type) {
      if (isMuted) return;
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;

        if (type === 'hit') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(680, now + 0.09);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'golden') {
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.045);
            gain.gain.setValueAtTime(0.22, now + idx * 0.045);
            gain.gain.exponentialRampToValueAtTime(0.008, now + idx * 0.045 + 0.16);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.045);
            osc.stop(now + idx * 0.045 + 0.16);
          });
        } else if (type === 'bomb') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.linearRampToValueAtTime(42, now + 0.28);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'over') {
          [440, 392, 349.23, 261.63].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.11);
            gain.gain.setValueAtTime(0.2, now + idx * 0.11);
            gain.gain.linearRampToValueAtTime(0.01, now + idx * 0.11 + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.11);
            osc.stop(now + idx * 0.11 + 0.2);
          });
        }
      } catch (e) {
        // 忽略瀏覽器未互動前的音訊阻擋錯誤
      }
    }

    // --- DOM 元素 ---
    const boardEl = document.getElementById('board');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const bestDisplay = document.getElementById('bestDisplay');
    const timeDisplay = document.getElementById('timeDisplay');
    const timeProgress = document.getElementById('timeProgress');
    const startBtn = document.getElementById('startBtn');
    const muteBtn = document.getElementById('muteBtn');
    const diffBtns = document.querySelectorAll('.diff-btn');
    const resultModal = document.getElementById('resultModal');
    const finalScore = document.getElementById('finalScore');
    const finalComment = document.getElementById('finalComment');
    const newRecordBadge = document.getElementById('newRecordBadge');
    const playAgainBtn = document.getElementById('playAgainBtn');
    const gameContainer = document.getElementById('gameContainer');

    bestDisplay.textContent = highScore;

    // --- 初始化 9 宮格地洞 ---
    function initBoard() {
      boardEl.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        const hole = document.createElement('div');
        hole.className = 'hole';
        hole.dataset.index = i;

        hole.innerHTML = `
          <div class="character mole-normal" id="char-${i}">
            <div class="mole-body">
              <span class="crown" style="display:none;">👑</span>
              <span class="fuse" style="display:none;">🧨</span>
              <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
              <div class="nose"></div>
              <div class="cheeks"></div>
              <div class="dizzy-face">💫</div>
            </div>
          </div>
          <div class="hole-front"></div>
        `;

        const charEl = hole.querySelector('.character');
        charEl.addEventListener('pointerdown', (e) => whack(i, e));
        boardEl.appendChild(hole);
      }
    }

    // --- 隨機決定角色種類（70% 普通、15% 黃金、15% 炸彈）---
    function rollCharacterType() {
      const r = Math.random();
      if (r < 0.70) return { type: 'normal', points: 10, stayRatio: 1.0 };
      if (r < 0.85) return { type: 'golden', points: 30, stayRatio: 0.75 };
      return { type: 'bomb', points: -20, stayRatio: 0.95 };
    }

    // --- 在指定地洞生成角色 ---
    function spawnAtHole(index) {
      if (!isPlaying || activeHoles[index]) return;

      const charInfo = rollCharacterType();
      const charEl = document.getElementById(`char-${index}`);
      const crownEl = charEl.querySelector('.crown');
      const fuseEl = charEl.querySelector('.fuse');
      const dizzyEl = charEl.querySelector('.dizzy-face');

      charEl.className = `character mole-${charInfo.type}`;
      crownEl.style.display = charInfo.type === 'golden' ? 'block' : 'none';
      fuseEl.style.display = charInfo.type === 'bomb' ? 'block' : 'none';
      dizzyEl.textContent = charInfo.type === 'bomb' ? '💥' : '💫';

      activeHoles[index] = {
        ...charInfo,
        whacked: false
      };

      // 觸發彈出動畫
      requestAnimationFrame(() => {
        charEl.classList.add('up');
      });

      const config = DIFFICULTY_CONFIG[currentDiff];
      const stayDuration = Math.round(config.stayTime * charInfo.stayRatio);

      holeTimeouts[index] = setTimeout(() => {
        hideHole(index);
      }, stayDuration);
    }

    function hideHole(index) {
      const charEl = document.getElementById(`char-${index}`);
      if (charEl) {
        charEl.classList.remove('up', 'bonked');
      }
      clearTimeout(holeTimeouts[index]);
      holeTimeouts[index] = null;
      activeHoles[index] = null;
    }

    // --- 隨機挑選空地洞冒出 ---
    function triggerSpawnCycle() {
      if (!isPlaying) return;

      const emptyIndices = [];
      for (let i = 0; i < 9; i++) {
        if (!activeHoles[i]) emptyIndices.push(i);
      }

      if (emptyIndices.length > 0) {
        const firstIdx = emptyIndices.splice(Math.floor(Math.random() * emptyIndices.length), 1)[0];
        spawnAtHole(firstIdx);

        // 困難或普通模式下有機率同時冒出第 2 隻
        const doubleChance = DIFFICULTY_CONFIG[currentDiff].doubleChance;
        if (emptyIndices.length > 0 && Math.random() < doubleChance) {
          const secondIdx = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
          spawnAtHole(secondIdx);
        }
      }
    }

    // --- 點擊擊中判定（包含防作弊鎖定） ---
    function whack(index, event) {
      if (!isPlaying) return;
      const state = activeHoles[index];
      if (!state || state.whacked) return;

      // 立即標記已擊中，防止連點刷分
      state.whacked = true;
      clearTimeout(holeTimeouts[index]);

      const charEl = document.getElementById(`char-${index}`);
      const holeEl = charEl.parentElement;
      charEl.classList.add('bonked');

      // 更新分數（最低扣至 0 分）
      score = Math.max(0, score + state.points);
      scoreDisplay.textContent = score;

      if (score > highScore) {
        highScore = score;
        bestDisplay.textContent = highScore;
        localStorage.setItem(STORAGE_KEY, highScore);
      }

      // 播放音效與視覺特效
      if (state.type === 'golden') {
        playSound('golden');
        showFloatingText(holeEl, '+30 🌟', '#eab308');
      } else if (state.type === 'bomb') {
        playSound('bomb');
        showFloatingText(holeEl, '-20 💥', '#ef4444');
        gameContainer.classList.remove('shake-danger');
        void gameContainer.offsetWidth;
        gameContainer.classList.add('shake-danger');
      } else {
        playSound('hit');
        showFloatingText(holeEl, '+10', '#16a34a');
      }

      showHammerEffect(holeEl, event);

      setTimeout(() => {
        hideHole(index);
      }, 180);
    }

    function showFloatingText(holeEl, text, color) {
      const floatEl = document.createElement('div');
      floatEl.className = 'float-text';
      floatEl.textContent = text;
      floatEl.style.color = color;
      holeEl.appendChild(floatEl);
      setTimeout(() => floatEl.remove(), 650);
    }

    function showHammerEffect(holeEl, event) {
      const hammer = document.createElement('div');
      hammer.className = 'hammer-fx';
      hammer.textContent = '🔨';
      const rect = holeEl.getBoundingClientRect();
      const x = event.clientX ? event.clientX - rect.left : rect.width / 2;
      const y = event.clientY ? event.clientY - rect.top : rect.height / 2;
      hammer.style.left = `${x}px`;
      hammer.style.top = `${y}px`;
      holeEl.appendChild(hammer);
      setTimeout(() => hammer.remove(), 250);
    }

    // --- 開始 / 重新開始遊戲 ---
    function startGame() {
      stopAllTimers();
      for (let i = 0; i < 9; i++) hideHole(i);

      score = 0;
      timeLeft = GAME_DURATION;
      isPlaying = true;
      const previousBest = Number(localStorage.getItem(STORAGE_KEY)) || 0;
      gameContainer.dataset.prevBest = previousBest;

      scoreDisplay.textContent = '0';
      timeDisplay.textContent = `${timeLeft}s`;
      timeDisplay.classList.remove('low');
      timeProgress.style.width = '100%';
      startBtn.textContent = '重新開始';
      resultModal.classList.remove('show');

      diffBtns.forEach(btn => btn.disabled = true);

      const config = DIFFICULTY_CONFIG[currentDiff];
      triggerSpawnCycle();
      spawnTimer = setInterval(triggerSpawnCycle, config.spawnInterval);

      countdownTimer = setInterval(() => {
        timeLeft -= 1;
        timeDisplay.textContent = `${timeLeft}s`;
        timeProgress.style.width = `${(timeLeft / GAME_DURATION) * 100}%`;

        if (timeLeft <= 5) {
          timeDisplay.classList.add('low');
        }

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function stopAllTimers() {
      clearInterval(countdownTimer);
      clearInterval(spawnTimer);
      for (let i = 0; i < 9; i++) {
        clearTimeout(holeTimeouts[i]);
      }
    }

    function endGame() {
      isPlaying = false;
      stopAllTimers();
      for (let i = 0; i < 9; i++) hideHole(i);

      diffBtns.forEach(btn => btn.disabled = false);
      startBtn.textContent = '開始遊戲';
      playSound('over');

      const prevBest = Number(gameContainer.dataset.prevBest) || 0;
      const brokeRecord = score > 0 && score > prevBest;
      newRecordBadge.style.display = brokeRecord ? 'inline-block' : 'none';
      finalScore.textContent = score;

      if (score >= 250) {
        finalComment.textContent = '🏆 神乎其技！地鼠看到你都會繞道走！';
      } else if (score >= 140) {
        finalComment.textContent = '⚡ 手速驚人！反應非常敏捷！';
      } else if (score >= 60) {
        finalComment.textContent = '👍 表現不錯，再試一局挑戰更高分！';
      } else {
        finalComment.textContent = '🌱 暖身結束！小心別敲到炸彈喔！';
      }

      resultModal.classList.add('show');
    }

    // --- 事件綁定 ---
    startBtn.addEventListener('click', startGame);
    playAgainBtn.addEventListener('click', startGame);

    muteBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      muteBtn.textContent = isMuted ? '🔇' : '🔊';
    });

    diffBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        if (isPlaying) return;
        diffBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentDiff = btn.dataset.diff;
      });
    });

    // 啟動初始化
    initBoard();
  </script>
</body>
</html>
